<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Partner Solution Pattern" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2A44"/>
      <stop offset="1" stop-color="#0F1730"/>
    </linearGradient>
  </defs>

  <!-- Background tile (do not change) -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Motif: a package being deployed onto a platform -->
  <!-- Platform: two stacked layers -->
  <rect x="56" y="176" width="144" height="24" rx="8" fill="#4A7BF7" opacity="0.5"/>
  <rect x="56" y="144" width="144" height="24" rx="8" fill="#4A7BF7"/>

  <!-- Deploy arrow -->
  <path d="M128 60 v52" stroke="#7FD1B9" stroke-width="6" stroke-linecap="round"/>
  <path d="M108 96 l20 20 l20 -20" fill="none" stroke="#7FD1B9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Package -->
  <rect x="100" y="36" width="56" height="20" rx="6" fill="#4A7BF7" opacity="0.75"/>
</svg>
