<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Telemetry flowing into an extractor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F2A44"/>
      <stop offset="1" stop-color="#0F1730"/>
    </linearGradient>
  </defs>

  <!-- Background tile (do not change) -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Telemetry -->
  <path d="M44 128 H62 V74 H94 V128 H150" fill="none" stroke="#4A7BF7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Extractor -->
  <rect x="162" y="84" width="50" height="88" rx="14" fill="#4A7BF7"/>

  <!-- Flow into the extractor -->
  <path d="M134 106 L174 128 L134 150" fill="none" stroke="#7FD1B9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
